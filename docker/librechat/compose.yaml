name: aws-multimodel-llm-platform-v0

services:
  caddy:
    image: caddy:2.10.0-alpine
    restart: unless-stopped
    env_file:
      - ${RUNTIME_ENV_FILE:-.env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${RUNTIME_DATA_ROOT:?Set RUNTIME_DATA_ROOT in .env}/caddy/data:/data
      - ${RUNTIME_DATA_ROOT:?Set RUNTIME_DATA_ROOT in .env}/caddy/config:/config
    depends_on:
      - librechat
      - cost-dashboard
    networks:
      - edge
      - application

  librechat:
    image: ${LIBRECHAT_IMAGE:?Set LIBRECHAT_IMAGE in .env}
    restart: unless-stopped
    env_file:
      - ${RUNTIME_ENV_FILE:-.env}
    environment:
      HOST: 0.0.0.0
      NODE_ENV: production
    expose:
      - "3080"
    volumes:
      - ../../config/librechat/librechat.yaml:/app/librechat.yaml:ro
      - ${RUNTIME_DATA_ROOT:?Set RUNTIME_DATA_ROOT in .env}/librechat/app-data:/app/data
      - ${RUNTIME_DATA_ROOT:?Set RUNTIME_DATA_ROOT in .env}/librechat/uploads:/app/uploads
      - ${RUNTIME_DATA_ROOT:?Set RUNTIME_DATA_ROOT in .env}/librechat/logs:/app/logs
      - ${RUNTIME_DATA_ROOT:?Set RUNTIME_DATA_ROOT in .env}/librechat/images:/app/client/public/images
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - application
      - database

  mongodb:
    image: mongo:7.0.41@sha256:b096b4cb9269f3ebcf363be63f1c50920f786879d03a1890347a3bf33f1f0df0
    restart: unless-stopped
    env_file:
      - ${RUNTIME_ENV_FILE:-.env}
    command: ["mongod", "--auth", "--bind_ip_all"]
    volumes:
      - ${RUNTIME_DATA_ROOT:?Set RUNTIME_DATA_ROOT in .env}/mongodb:/data/db
      - ${RUNTIME_DATA_ROOT:?Set RUNTIME_DATA_ROOT in .env}/mongodb-configdb:/data/configdb
      - ./mongodb-init.js:/docker-entrypoint-initdb.d/10-create-librechat-user.js:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --username "$$MONGO_INITDB_ROOT_USERNAME"
          --password "$$MONGO_INITDB_ROOT_PASSWORD"
          --authenticationDatabase admin
          --eval "db.adminCommand('ping').ok"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - database

  cost-dashboard:
    build:
      context: ../cost-dashboard
    restart: unless-stopped
    env_file:
      - ${RUNTIME_ENV_FILE:-.env}
    environment:
      COST_DASHBOARD_PORT: "8080"
      COST_EXPLORER_REGION: us-east-1
      COST_DASHBOARD_PRICING_FILE: /var/lib/cost-dashboard/pricing.json
    volumes:
      - ${RUNTIME_DATA_ROOT:?Set RUNTIME_DATA_ROOT in .env}/cost-dashboard:/var/lib/cost-dashboard:ro
    expose:
      - "8080"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - application
      - database

networks:
  edge:
  application:
  database:
    internal: true
