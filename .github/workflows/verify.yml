name: Verify repository

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  deployments: write

jobs:
  terraform:
    name: Validate Terraform
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.2
      - name: Check Terraform formatting
        run: make terraform-fmt
      - name: Initialize Terraform without a remote backend
        run: terraform -chdir=infrastructure/terraform init -backend=false
      - name: Validate Terraform configuration
        run: terraform -chdir=infrastructure/terraform validate -no-color
      - name: Initialize Terraform bootstrap without a remote backend
        run: terraform -chdir=infrastructure/bootstrap init -backend=false
      - name: Validate Terraform bootstrap configuration
        run: terraform -chdir=infrastructure/bootstrap validate -no-color

  runtime:
    name: Validate runtime assets
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Check shell scripts
        run: bash -n scripts/bootstrap-v0.sh scripts/render-librechat-env.sh scripts/deploy-librechat-on-ec2.sh scripts/rebuild-librechat-on-ec2.sh scripts/close-librechat-registration-on-ec2.sh scripts/initialize-v0-secrets.sh scripts/initialize-cost-dashboard-secret.sh scripts/configure-cost-dashboard-mongodb-on-ec2.sh scripts/migrate-librechat-credentials-to-hex.sh scripts/refresh-librechat-credentials-on-ec2.sh scripts/install-cost-pricing-sync-on-ec2.sh scripts/sync-cost-pricing-on-ec2.sh
      - name: Check MongoDB initialization script
        run: node --check docker/librechat/mongodb-init.js
      - name: Set up Node.js for the cost dashboard
        uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: npm
          cache-dependency-path: docker/cost-dashboard/package-lock.json
      - name: Check cost dashboard dependencies and syntax
        working-directory: docker/cost-dashboard
        run: |
          npm ci --omit=dev
          npm audit --omit=dev --audit-level=high
          node --check server.mjs
          node --check sync-pricing.mjs
          node --input-type=module -e "import { readFileSync } from 'node:fs'; const source = readFileSync('server.mjs', 'utf8'); if (!source.includes(\"fetch('/cost/api/summary?days='+days)\")) throw new Error('The cost dashboard must request its API through the /cost prefix.');"
      - name: Validate Compose interpolation
        working-directory: docker/librechat
        run: >-
          RUNTIME_ENV_FILE=.env.example
          docker compose --env-file .env.example -f compose.yaml config --quiet
      - name: Validate Caddy configuration
        working-directory: docker/librechat
        run: >-
          docker run --rm
          -e CADDY_DOMAIN=ci.example.com
          -e CADDY_ACME_EMAIL=ci@example.com
          -e COST_DASHBOARD_USERNAME=cost-admin
          -e COST_DASHBOARD_PASSWORD_HASH=JDJhJDE0JEtyWDVnVUdpajg0eWp4YVBoa0Z2Vy5aVk0xeWM1VzkvNmJGL3I2MFg5SlBMa2IxWUZLWlNH
          -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro"
          caddy:2.10.0-alpine
          caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

  human-approval:
    name: Human approval
    if: github.event_name == 'pull_request'
    needs:
      - terraform
      - runtime
    runs-on: ubuntu-24.04
    environment:
      name: human-approval
    steps:
      - name: Record approval
        run: echo "A GitHub environment reviewer approved this pull request."
